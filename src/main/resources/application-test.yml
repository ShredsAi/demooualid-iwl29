spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    producer:
      acks: all
      retries: 0
      batch-size: 16384
      linger-ms: 0
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: trip-request-matching-shred-test
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "ai.shreds.shared.dtos"
    listener:
      ack-mode: manual_immediate
      concurrency: 1
  integration:
    channels:
      tripExecutionChannel: direct

external-services:
  rider-service:
    url: http://localhost:8081
    timeout: 1000
  pricing-service:
    url: http://localhost:8082
    timeout: 1000
  payment-service:
    url: http://localhost:8083
    timeout: 1000
  driver-service:
    url: http://localhost:8084
    timeout: 1000

resilience4j:
  circuitbreaker:
    instances:
      rider:
        disabled: true
      pricing:
        disabled: true
      payment:
        disabled: true
      driver:
        disabled: true
  retry:
    instances:
      external-service:
        disabled: true
  bulkhead:
    instances:
      external-service:
        disabled: true

matching:
  timeout:
    duration: 5000  # 5 seconds for tests

logging:
  level:
    root: WARN
    ai.shreds: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: false
    kafka:
      enabled: false
    db:
      enabled: true
