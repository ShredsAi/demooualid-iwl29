server:
  port: 8080
  servlet:
    context-path: /
  shutdown: graceful

spring:
  application:
    name: trip-request-matching-shred
  profiles:
    active: default
  datasource:
    url: jdbc:postgresql://localhost:5432/trip_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      minimum-idle: 10
      pool-name: TripRequestPool
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 1
      buffer-memory: 33554432
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      enable-idempotence: true
      properties:
        max.in.flight.requests.per.connection: 5
        compression.type: snappy
    consumer:
      group-id: trip-request-matching-shred
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "ai.shreds.shared.dtos"
        max.poll.records: 500
        max.poll.interval.ms: 300000
    listener:
      ack-mode: manual_immediate
      concurrency: 3
    topics:
      trip-lifecycle-events: trip-lifecycle-events
      matching-requests: matching-requests
      matching-service-responses: matching-service-responses
  integration:
    channels:
      tripExecutionChannel: direct

external-services:
  rider-service:
    url: http://rider-service:8081
    timeout: 5000
  pricing-service:
    url: http://pricing-service:8082
    timeout: 10000
  payment-service:
    url: http://payment-service:8083
    timeout: 15000
  driver-service:
    url: http://driver-service:8084
    timeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      rider:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
      pricing:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
      payment:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
      driver:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      external-service:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
  bulkhead:
    instances:
      external-service:
        max-concurrent-calls: 10
        max-wait-duration: 0ms

matching:
  timeout:
    duration: 300000  # 5 minutes in milliseconds

logging:
  level:
    root: INFO
    ai.shreds: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/trip-request-matching-shred.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    circuitbreakers:
      enabled: true
    kafka:
      enabled: true
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      sla:
        http.server.requests: 100ms, 500ms, 1s

info:
  app:
    name: Trip Request and Matching Coordination Shred
    description: Hexagonal architecture microservice for trip lifecycle management
    version: 1.0.0
    encoding: UTF-8
    java:
      version: 17
